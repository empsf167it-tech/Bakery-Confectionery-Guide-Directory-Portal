<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register at Sweet Symphony — Sign up to track your sweet orders and earn rewards points." />
  <title>Create Account — Sweet Symphony</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍰</text></svg>">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link id="rtl-stylesheet" rel="stylesheet" href="../assets/css/rtl.css" disabled />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .progress-steps { display:flex;align-items:center;justify-content:center;gap:.5rem;margin-bottom:2rem; }
    .progress-step { width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;transition:var(--transition); }
    .progress-step.active { background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(142,125,90,.3); }
    .progress-step.done { background:rgba(142,125,90,.15);color:var(--primary); }
    .progress-step.inactive { background:var(--bg-secondary);color:var(--text-light);border:2px solid var(--border); }
    .progress-line { flex:1;max-width:60px;height:2px;background:var(--border); }
    .progress-line.done { background:var(--primary); }
    .trial-banner { background:linear-gradient(135deg,rgba(142,125,90,.1),rgba(174,158,124,.1));border:1px solid rgba(142,125,90,.2);border-radius:var(--radius-md);padding:1rem 1.25rem;display:flex;align-items:center;gap:.75rem;margin-bottom:2rem; }
    .trial-banner i { color:var(--primary);font-size:1.2rem;flex-shrink:0; }
    .trial-banner p { font-size:.88rem;color:var(--text-secondary);margin:0; }
    .trial-banner strong { color:var(--primary); }
    .strength-bar { height:4px;border-radius:2px;background:var(--border);margin-top:.5rem;overflow:hidden; }
    .strength-fill { height:100%;border-radius:2px;transition:var(--transition);width:0; }
    .strength-label { font-size:.75rem;margin-top:.3rem; }
  </style>
</head>
<body>

<div class="auth-container auth-register-bg">
  <div class="auth-form-side">
    <div class="auth-form-container">
      <a href="../index.html" class="auth-logo">
        <div class="brand-logo">
          <svg viewBox="16 26 68 54" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:33px; height:33px; display:block;">
            <path d="M26 44Q28.5 44 28.5 41.5Q28.5 44 31 44Q28.5 44 28.5 46.5Q28.5 44 26 44Z" fill="#ffffff"/>
            <path d="M20 54Q22.5 54 22.5 51.5Q22.5 54 25 54Q22.5 54 22.5 56.5Q22.5 54 20 54Z" fill="#ffffff"/>
            <path d="M41 38Q43 38 43 36Q43 38 45 38Q43 38 43 40Q43 38 41 38Z" fill="#ffffff"/>
            <path d="M55 38Q57 38 57 36Q57 38 59 38Q57 38 57 40Q57 38 55 38Z" fill="#ffffff"/>
            <path d="M69 44Q71.5 44 71.5 41.5Q71.5 44 74 44Q71.5 44 71.5 46.5Q71.5 44 69 44Z" fill="#ffffff"/>
            <path d="M75 54Q77.5 54 77.5 51.5Q77.5 54 80 54Q77.5 54 77.5 56.5Q77.5 54 75 54Z" fill="#ffffff"/>
            <circle cx="37" cy="41" r="1" fill="#ffffff"/>
            <circle cx="63" cy="41" r="1" fill="#ffffff"/>
            <circle cx="32" cy="50" r="1" fill="#ffffff"/>
            <circle cx="68" cy="50" r="1" fill="#ffffff"/>
            <path d="M50 31C49 33 48.5 35 50 37.5C51.5 35 51 33 50 31Z" fill="#ffffff"/>
            <path d="M50 38C48 40.5 45.5 42 49 44.5C52.5 42 52 40.5 50 38Z" fill="#ffffff"/>
            <path d="M48 42C44.5 40 43 43.5 48.5 44.5Z" fill="#ffffff"/>
            <path d="M52 42C55.5 40 57 43.5 51.5 44.5Z" fill="#ffffff"/>
            <path d="M39 44C39 42.5 61 42.5 61 44V51.5C61 53.5 39 53.5 39 51.5Z" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.8"/>
            <path d="M39 44C39 45.5 61 45.5 61 44" stroke="#ffffff" stroke-width="1.8"/>
            <path d="M39.5 48.5C42.5 51 45.5 51 48.5 48.5C51.5 51 54.5 51 57.5 48.5C59.5 50 60.5 49.5 60.5 48.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M34.5 51C34.5 49 65.5 49 65.5 51V60.5C65.5 63 34.5 63 34.5 60.5Z" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.8"/>
            <path d="M34.5 51C34.5 53 65.5 53 65.5 51" stroke="#ffffff" stroke-width="1.8"/>
            <path d="M35 56.5C39 60 43.5 60 48 56.5C52.5 60 57 60 61 56.5C63.5 58.5 65 57.5 65 56.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M29.5 59.5C29.5 57 70.5 57 70.5 59.5V70C70.5 73.5 29.5 73.5 29.5 70Z" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.8"/>

            <path d="M25 75C25 73 75 73 75 75C75 77.5 25 77.5 25 75Z" fill="#ffffff" fill-opacity="0.6" stroke="#ffffff" stroke-width="1.6"/>
          </svg>
        </div>
        <span class="brand-name">Sweet <span>Symphony</span></span>
      </a>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Create your account to track orders, save flavor preferences, and earn rewards.</p>

      <!-- Registration form -->
      <form data-validate-form>
        <div class="form-group">
          <label class="form-label" for="reg-fname">First Name *</label>
          <input type="text" id="reg-fname" class="form-control" placeholder="" data-validate="required" autocomplete="given-name" />
        </div>
        
        <div class="form-group">
          <label class="form-label" for="reg-lname">Last Name *</label>
          <input type="text" id="reg-lname" class="form-control" placeholder="" data-validate="required" autocomplete="family-name" />
        </div>
        
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="" data-validate="required,email" autocomplete="email" />
        </div>
        
        <div class="form-group">
          <label class="form-label" for="reg-phone">Phone Number *</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="" data-validate="required,phone" autocomplete="tel" />
        </div>
        
        <div class="form-group">
          <label class="form-label" for="reg-interest">Main Project Interest *</label>
          <select id="reg-interest" class="form-control" data-validate="required">
            <option value="">Select interest...</option>
            <option>Custom Birthday/Celebration Cakes</option>
            <option>Festive Sweet Boxes &amp; Hampers</option>
            <option>Event/Wedding Dessert Catering</option>
            <option>Artisanal Sourdough &amp; Pastries</option>
            <option>General Customer Account</option>
          </select>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="reg-password">Password *</label>
          <div class="password-toggle">
            <input type="password" id="reg-password" class="form-control" placeholder="Create a strong password" data-validate="required,minLength:8" autocomplete="new-password" oninput="checkStrength(this.value)" />
            <button type="button" class="toggle-btn fas fa-eye" aria-label="Toggle password visibility"></button>
          </div>
          <div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
          <div id="strength-label" class="strength-label"></div>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password *</label>
          <div class="password-toggle">
            <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat your password" data-validate="required,minLength:8" autocomplete="new-password" />
            <button type="button" class="toggle-btn fas fa-eye" aria-label="Toggle password visibility"></button>
          </div>
        </div>
        
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="terms" required />
            <label for="terms" style="font-size:.85rem;color:var(--text-secondary);">I agree to the <a href="#" style="color:var(--primary)">Terms of Service</a> and <a href="#" style="color:var(--primary)">Privacy Policy</a> *</label>
          </div>
        </div>
        <div class="form-group">
          <div class="checkbox-group">
            <input type="checkbox" id="offers" />
            <label for="offers" style="font-size:.85rem;color:var(--text-secondary);">Send me baking tips, recipes, and exclusive sweet offers</label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-bottom:1.5rem;">
          <i class="fas fa-user-plus"></i> Create Account
        </button>

        <div class="auth-divider">or continue with</div>
        <div class="social-signin">
          <button class="social-btn" type="button"><i class="fab fa-google"></i> Google</button>
          <button class="social-btn" type="button"><i class="fab fa-apple"></i> Apple</button>
        </div>
      </form>

      <div class="auth-footer">
        Already have a portal account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
<script>
  function checkStrength(val) {
    const fill = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
      { width: '0%', color: '#ef4444', text: 'Too short' },
      { width: '25%', color: '#ef4444', text: 'Weak' },
      { width: '50%', color: '#f59e0b', text: 'Fair' },
      { width: '75%', color: '#10b981', text: 'Good' },
      { width: '100%', color: '#10b981', text: 'Strong ✓' },
    ];
    const l = levels[val.length === 0 ? 0 : score];
    fill.style.width = l.width;
    fill.style.background = l.color;
    label.textContent = l.text;
    label.style.color = l.color;
  }
</script>
</body>
</html>
